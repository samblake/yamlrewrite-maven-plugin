# Environment set to 'production' to test conditional transformations
environment: production

apiVersion: v1
kind: ConfigMap
metadata:
  name: my-config
  namespace: default
  labels:
    version: v1.0
data:
  app:
    name: myapp
    replicas: 1
    debug: false
    image: myapp:1.0
    deprecated_feature:
      enabled: true
      setting: old_value
    temp_config:
      timeout: 30
    database:
      host: localhost
      port: 5432
  settings:
    timeout: 30

