# Comprehensive transformation file that covers all scenarios:
# - Unconditional operations (set, delete, merge, rename)
# - Conditional operations based on environment (dev, staging, production)

transformations:
  # ========== UNCONDITIONAL OPERATIONS (Always applied) ==========

  # Update version metadata
  - operation: set
    path: metadata.version
    value: 2.0

  # Update image for all environments
  - operation: set
    path: data.app.image
    value: myapp:2.0

  # Delete deprecated feature
  - operation: delete
    path: data.app.deprecated_feature

  # Merge database configuration
  - operation: merge
    path: data.app.database
    value:
      pool_size: 20
      ssl_enabled: true
      replica_set: enabled
      backup_enabled: true
      connection_timeout: 60

  # ========== CONDITIONAL OPERATIONS ==========

  # ---- Development Environment ----
  # Only enable debug mode in development
  - operation: set
    path: data.app.debug
    value: true
    when:
      type: equals
      path: environment
      value: dev

  # Only set dev replicas (minimum resources)
  - operation: set
    path: data.app.replicas
    value: 1
    when:
      type: equals
      path: environment
      value: dev

  # ---- Staging Environment ----
  # Set moderate replicas in staging
  - operation: set
    path: data.app.replicas
    value: 2
    when:
      type: equals
      path: environment
      value: staging

  # ---- Production Environment ----
  # Increase replicas in production (high availability)
  - operation: set
    path: data.app.replicas
    value: 5
    when:
      type: equals
      path: environment
      value: production

  # Set production-specific image tag
  - operation: set
    path: data.app.image
    value: myapp:2.0-prod
    when:
      type: equals
      path: environment
      value: production

  # Enable advanced monitoring in production
  - operation: merge
    path: metadata.labels
    value:
      monitoring: enabled
      tier: critical
      sla: gold
    when:
      type: equals
      path: environment
      value: production

  # Conditional rename in production
  - operation: rename
    from: data.app.temp_config
    to: data.app.permanent_config
    when:
      type: equals
      path: environment
      value: production

  # Set production environment label
  - operation: set
    path: metadata.labels.environment
    value: production
    when:
      type: equals
      path: environment
      value: production
